[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmd-fixer"
dynamic = ["version"]
description = "Reviewable clean-up of laser metal deposition (LMD) G-code/PTP programs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "pyqtgraph>=0.13",  # the 3D view
    "PyOpenGL",
    "numpy",
    "pandas",  # the material database
    "hidapi",  # SpaceMouse input
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[project.gui-scripts]
# A GUI script: on Windows it starts without a console window.
lmd-fixer = "lmd_fixer.cli:main"

[tool.setuptools.dynamic]
version = {attr = "lmd_fixer.__version__"}

[tool.setuptools.packages.find]
include = ["lmd_fixer*"]
exclude = ["lmd_fixer.tests*"]

[tool.setuptools.package-data]
lmd_fixer = ["fix_settings.toml"]

[tool.pytest.ini_options]
# lmd_fixer/tests/ holds the example .ptp files, not test code.
testpaths = ["tests"]
