[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmd-fixer"
dynamic = ["version"]
description = "Reviewable clean-up of laser metal deposition (LMD) G-code/PTP programs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.36",
]

[project.scripts]
lmd-fixer = "lmd_fixer.cli:main"

[tool.setuptools.dynamic]
version = {attr = "lmd_fixer.__version__"}

[tool.setuptools.packages.find]
include = ["lmd_fixer*"]
exclude = ["lmd_fixer.tests*"]

[tool.setuptools.package-data]
lmd_fixer = ["fix_settings.toml"]
